<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <!-- Spotlight Lamp Graphic -->
  <g id="spotlight-lamp">
    <!-- Hanging Bracket / Mount -->
    <rect x="180" y="20" width="22" height="70" rx="4" fill="#E85D04" />
    <path d="M191 90 V140" stroke="#FF6B00" stroke-width="18" stroke-linecap="round" />
    
    <!-- Yoke Arm -->
    <path d="M125 180 C125 130, 257 130, 257 180 V260 H235 V180 C235 148, 147 148, 147 180 V260 H125 Z" fill="#FF6B00" />
    
    <!-- Swivel Pivot Knobs -->
    <circle cx="136" cy="260" r="16" fill="#E85D04" />
    <circle cx="136" cy="260" r="8" fill="#FFA500" />
    
    <!-- Lamp Barrel Body (Tilted 45 degrees) -->
    <g transform="rotate(-35 190 260)">
      <!-- Main Housing Body -->
      <rect x="120" y="200" width="150" height="110" rx="55" fill="#FF6B00" />
      <rect x="135" y="215" width="120" height="80" rx="40" fill="#FA5A00" />
      
      <!-- Lens Ring & Glow -->
      <ellipse cx="270" cy="255" rx="20" ry="50" fill="#E85D04" />
      <ellipse cx="266" cy="255" rx="16" ry="46" fill="#FFFFFF" />
      <ellipse cx="262" cy="255" rx="12" ry="40" fill="#FFF9F5" />
    </g>
  </g>

  <!-- Typography -->
  <!-- "Si te" Subtle Background Silhouette -->
  <g opacity="0.08" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="200" letter-spacing="-6">
    <text x="360" y="200">Si</text>
    <text x="340" y="360">te</text>
  </g>

  <!-- Main Wordmark "dijera" (Orange Warm Punch) -->
  <g fill="#FF6B00" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="160" letter-spacing="-7">
    <text x="380" y="290">dijera</text>
  </g>

  <!-- Wordmark "que" (Orange Complement) -->
  <g fill="#FF6B00" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="165" letter-spacing="-7">
    <text x="380" y="420">que</text>
  </g>

  <!-- Accent Question Mark -->
  <g fill="#FFA500" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="150">
    <text x="730" y="420">?</text>
  </g>
</svg>
